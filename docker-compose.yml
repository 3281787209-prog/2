services:
  mysql:
    image: mysql:8.0
    container_name: earthwork_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: earthwork
      MYSQL_USER: earthwork
      MYSQL_PASSWORD: earthwork_pass
      MYSQL_ROOT_PASSWORD: root_pass
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - mysql_data:/var/lib/mysql

  minio:
    image: minio/minio:RELEASE.2025-01-20T14-49-07Z
    container_name: earthwork_minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      TZ: Asia/Shanghai
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

volumes:
  mysql_data:
  minio_data:

